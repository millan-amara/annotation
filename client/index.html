<!doctype html>

    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />

    <meta property="og:site_name" content="SpherePulse" />
    <meta property="og:title" content="SpherePulse &#8212; Managed Data Teams for Multilingual AI" />

      content="English-language annotation, transcription and model-alignment work at volume, plus native-speaker coverage in African languages. Teams recruited, contracted and managed from Nairobi, Kenya."
