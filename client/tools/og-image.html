<!--
  Source for public/og-image.png — the 1200x630 card shown when the site URL is
  pasted into LinkedIn, WeChat, WhatsApp, Slack or an email client.

  Regenerate after changing the homepage positioning, so the preview and the
  page do not say different things:

    chrome --headless=new --disable-gpu --hide-scrollbars       --force-device-scale-factor=1 --window-size=1200,630       --screenshot=public/og-image.png tools/og-image.html

  (On Windows: "C:/Program Files/Google/Chrome/Application/chrome.exe")

  Keep the text short. Most platforms render this card at a fraction of full
  size, and the headline is the only part reliably legible at that scale.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: #0c0c10;
        color: #fff;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        position: relative;
      }

      /* Single accent element: a rule down the left edge. */
      body::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 10px;
        background: #6d28d9;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand::before {
        content: "";
        width: 14px;
        height: 14px;
        background: #6d28d9;
        border-radius: 3px;
      }

      .brand span {
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h1 {
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 74px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.03em;
        max-width: 17ch;
      }

      .lanes {
        margin-top: 28px;
        font-size: 26px;
        line-height: 1.45;
        color: #b9b9c1;
        max-width: 44ch;
        text-wrap: balance;
      }

      footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 24px;
        font-size: 22px;
        color: #8b8b96;
      }

      footer .site {
        color: #c4b5fd;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span>SpherePulse</span>
    </div>

    <div>
      <h1>Managed data teams for multilingual AI</h1>
      <p class="lanes">
        Annotation, transcription and model alignment at volume, plus
        collection in African languages by native speakers.
      </p>
    </div>

    <footer>
      <span>Delivering since 2017 &middot; Nairobi, Kenya</span>
      <span class="site">spherepulseapp.com</span>
    </footer>
  </body>
</html>
